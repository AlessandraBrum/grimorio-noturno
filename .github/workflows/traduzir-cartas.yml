name: Traduzir cartas novas

on:
  schedule:
    - cron: '0 23 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traduzir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ctranslate2 sentencepiece sacremoses transformers torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python scripts/traduzir-cartas.py /tmp/modelo-traducao
      - run: |
          git add public/traducoes scripts/dados
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Alessandra Brum"
          git config user.email "101820673+AlessandraBrum@users.noreply.github.com"
          git commit -m "chore: update adapted Portuguese card texts"
          git push
